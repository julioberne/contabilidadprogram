# ==============================================================
# FIN-SYS OS — CI: compuertas automáticas en cada push (2026-09-04)
# El "revisor institucional": nadie puede olvidar correr las
# compuertas — GitHub las corre solo y marca el commit en rojo.
# Corre TODO lo que no necesita credenciales de BD.
# ==============================================================
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm install (no ci): el lockfile se genera en Windows y omite los
      # optionalDeps de Linux (rolldown/esbuild) — npm ci revienta en el
      # runner. Mismo criterio que frontend/Dockerfile.
      - run: npm install --no-audit --no-fund
      - name: Tests (vitest)
        run: npx vitest run
      - name: Lint crítico (errores que rompen en ejecución, no estilo)
        # 2026-10-06: no-undef, claves duplicadas, código inalcanzable, reglas de hooks...
        # El lint de estilo completo (`npm run lint`) tiene deuda vieja y no bloquea.
        run: python3 ../scripts/lint_critico.py --js
      - name: Build de producción
        run: npm run build
      - name: Guardia de peso — el entry no debe volver a engordar
        # El bug de vendor-blocknote metía 1.4MB en la carga inicial sin que
        # nadie lo notara. Este paso falla si lo precargado supera 500 KB.
        run: |
          TOTAL=0
          for f in $(grep -o -E '/assets/[^"]+' dist/index.html); do
            SZ=$(stat -c%s "dist$f" 2>/dev/null || echo 0)
            TOTAL=$((TOTAL + SZ))
          done
          echo "Carga inicial: $((TOTAL / 1024)) KB"
          if [ $TOTAL -gt 512000 ]; then
            echo "::error::La carga inicial pesa $((TOTAL / 1024)) KB (>500 KB). ¿Alguna librería se coló al entry?"
            exit 1
          fi
      - name: Sintaxis de nginx (nginx -t con la imagen de producción)
        # 2026-10-06: un error en nginx.conf tumbaría la web entera. Se valida con
        # la misma imagen del Dockerfile; "backend" apunta a localhost solo para el test.
        working-directory: .
        run: |
          docker run --rm --add-host backend:127.0.0.1 \
            -v "$PWD/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine nginx -t
      - name: Auditoría de dependencias (npm audit, solo producción)
        # 2026-10-06: avisa vulnerabilidades conocidas (altas o críticas) en las
        # librerías que llegan al navegador. Informativo: no bloquea el deploy.
        continue-on-error: true
        run: |
          if ! npm audit --omit=dev --audit-level=high; then
            echo "::warning title=npm audit::Hay vulnerabilidades altas o críticas: revisar 'npm audit' en frontend/."
            exit 1
          fi

  backend:
    name: Backend (sintaxis + tests puros + import)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libpq-dev
      - run: pip install -r requirements.txt
      - name: Sintaxis de todo el backend
        run: python -m compileall -q fin_sys_core routers kernel shared scripts server.py
      - name: Lint crítico (ruff E9/F63/F7/F82 — nombres no definidos, sintaxis)
        # 2026-10-06: compileall no ve un nombre mal escrito; ruff sí, sin ruido de estilo.
        run: |
          pip install -q ruff==0.16.10
          python scripts/lint_critico.py --py
      - name: Tests puros (sin BD)
        run: python -m unittest tests.test_cartera_plan tests.test_db_pool_fallback tests.test_mock_policy tests.test_bot_etapa_e tests.test_terceros_resolucion tests.test_tx_eliminar_evidencias tests.test_analytics_catalog tests.test_analytics_qa tests.test_insight_engine tests.test_bot_analisis tests.test_sms_bancolombia tests.test_bot_sms tests.test_webhooks_sms tests.test_bot_completar tests.test_terceros_cuentas tests.test_bot_webapp tests.test_terceros_borrado tests.test_export_xlsx tests.test_accounting_files tests.test_etiquetas tests.test_compendios tests.test_entrega tests.test_claude_kit -v
      - name: Auditoría de dependencias (pip-audit)
        # 2026-10-06: CVE conocidos en requirements.txt (Pillow, pypdf, openpyxl…:
        # las librerías que abren archivos de usuarios). Informativo: no bloquea.
        continue-on-error: true
        run: |
          pip install -q pip-audit
          if ! pip-audit -r requirements.txt --progress-spinner off; then
            echo "::warning title=pip-audit::Hay librerías con vulnerabilidades conocidas: revisar el log de este paso."
            exit 1
          fi
      - name: Smoke de importación del server
        # Detecta imports rotos sin necesitar BD (la conexión ocurre en el
        # lifespan, no al importar). dist vacío para el mount de estáticos.
        # Si falla, el traceback sale como ANOTACIÓN en el resumen del run.
        run: |
          mkdir -p frontend/dist/assets
          if ! python -c "import server; print('import server OK')" 2> import_err.txt; then
            cat import_err.txt
            echo "::error title=import server falló::$(tail -c 500 import_err.txt | tr '\n' ' § ')"
            exit 1
          fi

  # Los tests que tocan la BD compartida (kernel 5/5, bot, e2e) se corren en
  # local antes de cada push (CHECKLIST → Verificación mínima). Para moverlos
  # aquí harían falta una BD de CI y secretos DB_* — pendiente deliberado.
