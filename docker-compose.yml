# ==============================================================
# FIN-SYS OS v2.0 — Docker Compose (Producción)
# 2 servicios independientes: frontend (Nginx) + backend (FastAPI)
# ==============================================================

services:
  # ─────────────────────────────────────────────────────────────
  # BACKEND: FastAPI + Gunicorn
  # ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finsys-backend
    restart: unless-stopped
    # Variables inyectadas por Dokploy (Environment tab) vía interpolación ${VAR}
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SENTRY_DSN=${SENTRY_DSN}
      - CORS_ORIGINS=${CORS_ORIGINS}
      # Firma de los tokens de sesión (auth_guard). Definir en Dokploy →
      # Environment. Si falta, se deriva de DB_PASSWORD (funcional pero
      # menos rotable).
      - SESSION_SECRET=${SESSION_SECRET}
      # Afinación del pool y overrides de emergencia (2026-09-09): estas vars
      # eran "configurables por entorno" pero el compose NUNCA las pasaba al
      # contenedor. Defaults = comportamiento normal de siempre; se usan p.ej.
      # para el puente :5432 cuando el pooler :6543 de Supabase se cae.
      - DB_POOL_MIN=${DB_POOL_MIN:-10}   # = DB_POOL_MAX: pool caliente (H2; psycopg2 cierra lo que pasa de min)
      - DB_POOL_MAX=${DB_POOL_MAX:-10}
      - DB_FALLBACK_MAX=${DB_FALLBACK_MAX:-5}
      - FINSYS_ALLOW_5432=${FINSYS_ALLOW_5432:-0}
      # Exportación 13.6-c (2026-10-06): 🔔 aviso por Telegram de la 1.ª apertura
      # de un compendio. El backend solo hace sendMessage (jamás getUpdates: el
      # poller sigue viviendo solo en el servicio bot). Sin estas líneas el aviso
      # nunca salía: el compose no pasaba el token ni la bandera al contenedor.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - COMPENDIO_AVISO_TELEGRAM=${COMPENDIO_AVISO_TELEGRAM:-1}
      - COMPENDIO_AVISO_CHAT=${COMPENDIO_AVISO_CHAT:-}
      # Estándar H5 (2026-10-19): cola de trabajos pgmq. La API de producción
      # encola en `trabajos` (en local, por defecto, `trabajos_prueba`). La
      # exportación .xlsx va a la cola solo con FINSYS_EXPORT_EN_COLA=1, que se
      # enciende DESPUÉS de correr scripts/migrate_operaciones.py y con el
      # servicio worker arriba (si la cola no está instalada, sigue síncrona).
      - FINSYS_COLA=trabajos
      - FINSYS_EXPORT_EN_COLA=${FINSYS_EXPORT_EN_COLA:-0}
    expose:
      - "8000"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/vida"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - finsys-net

  # ─────────────────────────────────────────────────────────────
  # FRONTEND: Vite build + Nginx (proxy reverso)
  # ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finsys-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - finsys-net

  # ─────────────────────────────────────────────────────────────
  # BOT: poller de Telegram (Módulo 09) — PROCESO ÚNICO
  # Misma imagen del backend, command distinto. No expone puertos:
  # solo hace HTTPS saliente a api.telegram.org (no necesita TLS propio).
  # Las tablas del bot se migran ANTES del deploy con
  # scripts/migrate_bot_tables.py (desde la máquina local, misma Supabase).
  # ─────────────────────────────────────────────────────────────
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finsys-bot
    restart: unless-stopped
    command: ["python", "fin_sys_core/bot_telegram.py"]
    # El bot es un POLLER sin puerto HTTP: heredaba el HEALTHCHECK de la
    # imagen (curl :8000) y figuraba "unhealthy" eternamente aunque estuviera
    # trabajando perfecto (falso negativo crónico, detectado 09-sep). Se
    # deshabilita: mejor sin señal que con una señal mentirosa.
    healthcheck:
      disable: true
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # Token del bot de PRODUCCIÓN (distinto al de desarrollo: Telegram solo
      # permite un consumidor de getUpdates por token). Definir en Dokploy.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      # Mismos overrides de pool que el backend (puente :5432 de emergencia)
      - DB_POOL_MIN=${DB_POOL_MIN:-2}
      - DB_POOL_MAX=${DB_POOL_MAX:-10}
      - DB_FALLBACK_MAX=${DB_FALLBACK_MAX:-5}
      - FINSYS_ALLOW_5432=${FINSYS_ALLOW_5432:-0}
      # Etapa 09.F: purga de retención de borradores/mensajes del bot
      # (30/60/90 días, Regla 6b). 0 = apagada (kill-switch).
      - BOT_RETENCION_ACTIVA=${BOT_RETENCION_ACTIVA:-1}
    volumes:
      # El MISMO volumen del backend: las notas de voz que guarda el bot
      # deben existir para la web (evidencias servidas en /uploads).
      - uploads:/app/uploads
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - finsys-net

  # ─────────────────────────────────────────────────────────────
  # WORKER: trabajos de la cola pgmq (estándar H5, 2026-10-19)
  # Misma imagen, command distinto, sin puertos. Hace lo pesado que antes
  # corría dentro de la petición (hoy: la exportación .xlsx). Requiere
  # scripts/migrate_operaciones.py; sin la migración solo espera y registra.
  # FINSYS_WORKER_PRODUCCION=1 SOLO aquí: un worker local se niega a tomar
  # la cola de producción (la BD es la misma en local y en producción).
  # ─────────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finsys-worker
    restart: unless-stopped
    command: ["python", "-m", "fin_sys_core.worker"]
    # Sin HTTP: el worker toca un archivo en cada vuelta; si no lo toca en
    # 2 minutos, está colgado.
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/finsys-worker-vivo -mmin -2 | grep -q ."]
      interval: 60s
      timeout: 5s
      retries: 3
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SENTRY_DSN=${SENTRY_DSN}
      - FINSYS_COLA=trabajos
      - FINSYS_WORKER_PRODUCCION=1
      - FINSYS_WORKER_HILOS=${FINSYS_WORKER_HILOS:-2}
      # Pool chico y caliente: 2 trabajos a la vez + latidos (docs/escalamiento.md)
      - DB_POOL_MIN=${WORKER_DB_POOL:-3}
      - DB_POOL_MAX=${WORKER_DB_POOL:-3}
      - FINSYS_ALLOW_5432=${FINSYS_ALLOW_5432:-0}
    volumes:
      - uploads:/app/uploads
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - finsys-net

volumes:
  uploads:

networks:
  finsys-net:
    driver: bridge
