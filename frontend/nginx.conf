# FIN-SYS OS — Nginx config para frontend (endurecido)
# Sirve archivos estáticos + proxy reverso al backend

# WebSocket upgrade map (estándar, no hardcodear Connection: upgrade)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 2026-10-06 — Límite de ritmo de las rutas PÚBLICAS (compendio para el cliente):
# compartido por todos los workers y antes de llegar a Python. La clave es la IP
# real del cliente (ver set_real_ip_from abajo: nginx está detrás de Traefik).
limit_req_zone $binary_remote_addr zone=compendio_paginas:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=compendio_publico:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    # Compresión: el bundle viaja ~73% más liviano (auditoría 2026-09-04)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_comp_level 5;

    # IP real del cliente: Traefik (Dokploy) va delante en la red interna de Docker.
    # Sin esto, todos los clientes se verían con la IP de Traefik y el límite de
    # ritmo sería uno solo para todo el mundo.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    limit_req_status 429;

    # Frontend estático (Vite build)
    root /usr/share/nginx/html;
    index index.html;

    # Archivos estáticos con cache agresivo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy reverso: /api/* → backend FastAPI
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support (solo cuando hay Upgrade header)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Rutas públicas del compendio (comprobantes, aviso del visor, PDF/HTML): mismo
    # proxy que /api/, con límite de ritmo por IP. Prefijo más largo → gana sobre /api/.
    location /api/publico/ {
        limit_req zone=compendio_publico burst=60 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;          # el PDF de un compendio grande tarda unos segundos
    }

    # Uploads (archivos subidos)
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # 🔒 /docs y /openapi.json NO se exponen en producción
    # El healthcheck interno usa /api/health (accesible vía /api/)

    # Etapa 09.I — Mini App de Telegram: Telegram Web (web/webk/webz.telegram.org)
    # la abre en un iframe; frame-ancestors sustituye a X-Frame-Options SOLO aquí.
    # Una location con add_header propios NO hereda los del server: se repiten.
    location = /tg.html {
        add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://webk.telegram.org https://webz.telegram.org" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Exportación 13.6 — 🤝 Compendio para el cliente: /c/<código> es una página del
    # BACKEND (visor sin login), no del SPA. El backend pone sus cabeceras (CSP con
    # nonce, noindex, no-referrer, no-store); con un add_header propio esta location
    # no hereda los del server, así no se duplican ni se debilitan.
    location /c/ {
        limit_req zone=compendio_paginas burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Frame-Options "DENY" always;
    }

    # SPA fallback: cualquier ruta → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Seguridad básica
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Ocultar versión de Nginx
    server_tokens off;
}
